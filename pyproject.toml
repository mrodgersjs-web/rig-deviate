[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig-deviate"
version = "0.2.0"
description = "40 deterministic rewrite strategies across 13 strength levels, with a scorer for how generic a text is."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mike Rodgers" },
]
keywords = [
    "ai",
    "llm",
    "deviation",
    "scoring",
    "rig",
    "quality",
    "generative-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-deviate"
Repository = "https://github.com/mrodgersjs-web/rig-deviate"
Issues = "https://github.com/mrodgersjs-web/rig-deviate/issues"

[tool.hatch.build.targets.wheel]
packages = ["rig_deviate"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
